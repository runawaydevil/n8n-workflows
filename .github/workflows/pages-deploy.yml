name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - 'workflows/**'
      - 'docs/**'
      - 'scripts/**'
      - 'workflow_db.py'
      - 'api_server.py'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build and Generate Search Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create database directory
        run: mkdir -p database

      - name: Index workflows and generate search index
        run: |
          # Index all workflows
          python -c "
          from workflow_db import WorkflowDatabase
          db = WorkflowDatabase('database/workflows.db')
          stats = db.index_all_workflows(force_reindex=True)
          print(f'Indexed {stats[\"processed\"]} workflows')
          "

      - name: Generate static search index
        run: |
          python scripts/generate_search_index.py

      - name: Verify generated files
        run: |
          echo "Verifying generated files..."
          ls -lh docs/api/
          if [ ! -f "docs/api/search-index.json" ]; then
            echo "ERROR: search-index.json not found!"
            exit 1
          fi
          echo "✅ All files generated successfully"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload docs directory
          path: './docs'

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
